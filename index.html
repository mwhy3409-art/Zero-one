<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zero one</title>
<meta name="theme-color" content="#0E2A33">
<meta name="description" content="Daily news, markets, Guwahati weather and a run tracker.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--ink:#0E2A33;--mist:#E3ECEA;--paper:#F7F9F8;--tea:#2F6B4F;--red:#C62828;--mut:#5E747A;--line:#D3DFDD}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper)}
body{font-family:"Avenir Next","Segoe UI",Roboto,system-ui,sans-serif;color:var(--ink);overscroll-behavior-y:contain}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--tea);outline-offset:2px}
a{color:inherit;text-decoration:none}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 18px 6px}
.logo{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--red);display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:-.5px}
.brand{font-weight:700;font-size:18px;letter-spacing:-.2px}
.grow{flex:1}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--mut)}
.main{flex:1;padding:6px 18px 24px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:34px;line-height:1.05;margin:10px 0 2px;letter-spacing:-.5px}
h2{font-size:17px;margin:22px 0 8px;font-weight:700}
.sub{color:var(--mut);font-size:14px}
.hero{background:var(--ink);color:#F2F7F6;border-radius:20px;padding:18px;margin-top:10px}
.hero .sub{color:#A9C0C4}
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.temp{font-family:Georgia,serif;font-size:52px;line-height:1;font-weight:700}
.item{padding:13px 0;border-bottom:1px solid var(--line);display:block}
.item b{display:block;font-size:15.5px;line-height:1.3;font-weight:650}
.meta{font-size:12.5px;color:var(--mut);margin-top:5px}
.tag{font-size:12px;font-weight:650;color:var(--tea);margin-right:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;font-weight:600;color:var(--mut)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
nav{position:sticky;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--mut)}
nav button.on{color:var(--red)}
.btn{background:var(--tea);color:#fff;border-radius:14px;padding:14px 18px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg.i{width:20px;height:20px}
.btn.red{background:var(--red)}.btn.ghost{background:var(--mist);color:var(--ink)}.btn.block{width:100%}
.row{display:flex;gap:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;margin-top:14px;border-top:1px solid var(--line)}
.stat{padding:14px 4px;border-bottom:1px solid var(--line)}
.stat:nth-child(odd){border-right:1px solid var(--line);padding-right:12px}
.stat:nth-child(even){padding-left:16px}
.stat .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.stat .l{font-size:12.5px;color:var(--mut)}
.big{font-family:Georgia,serif;font-size:58px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.note{background:var(--mist);border-radius:12px;padding:11px 13px;font-size:13.5px;line-height:1.4;margin:10px 0}
.alert{border-left:4px solid var(--red);background:#FBEDED;padding:10px 12px;border-radius:0 10px 10px 0;margin:8px 0;font-size:14px}
.err{color:var(--red);font-size:14px;padding:14px 0}
.skel{height:14px;border-radius:7px;background:var(--mist);margin:14px 0}
.field{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);gap:12px}
.switch{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none}
.switch.on{background:var(--tea)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.switch.on::after{transform:translateX(20px)}
input[type=time],input[type=number]{font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;width:110px}
.up{color:var(--tea)}.down{color:var(--red)}
.pb{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.pb b{font-variant-numeric:tabular-nums}
.ring{position:relative;flex:none}
.ring>div{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============ helpers ============ */
const KEY = "zero-one-v1";
const DEF = { topics: ["Assam", "Northeast", "Markets", "India", "World"], notify: false, notifyTime: "07:00", goalKm: 3.2, weight: 65, lastNotified: "" };
const TOPICS = ["Assam", "Northeast", "India", "Markets", "Business", "World", "Sports", "Tech"];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const fmtDur = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return h ? `${h}:${pad(m)}:${pad(x)}` : `${pad(m)}:${pad(x)}`; };
const fmtPace = p => (!p || !isFinite(p) || p > 3600 ? "--:--" : `${Math.floor(p / 60)}:${pad(Math.round(p % 60))}`);
const km = m => (m / 1000).toFixed(2);
const sample = (a, n) => (a.length <= n ? a : a.filter((_, i) => i % Math.ceil(a.length / n) === 0));
const sameDay = (a, b) => a.toDateString() === b.toDateString();
const hav = (a, b) => { const r = x => x * Math.PI / 180, dl = r(b.lat - a.lat), dg = r(b.lng - a.lng); const h = Math.sin(dl / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dg / 2) ** 2; return 12742000 * Math.asin(Math.sqrt(h)); };
const ago = d => { const m = Math.round((Date.now() - new Date(d)) / 60000); if (!(m >= 0)) return ""; return m < 60 ? `${Math.max(m, 1)} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };

const IC = {
  home: '<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>',
  news: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  cloud: '<circle cx="8" cy="8" r="3"/><path d="M8 2v1M2 8h1M3.8 3.8l.7.7M12.2 3.8l-.7.7"/><path d="M8 20h9a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10.5 1.5A3.2 3.2 0 0 0 8 20z"/>',
  run: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
  sliders: '<path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2.2"/><circle cx="9" cy="12" r="2.2"/><circle cx="17" cy="18" r="2.2"/>',
  refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>',
  play: '<path d="M7 4v16l13-8z" fill="currentColor"/>',
  pause: '<rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/>',
  stop: '<rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/>',
  up: '<path d="m4 15 5-5 4 4 7-7"/>', down: '<path d="m4 9 5 5 4-4 7 7"/>',
};
const ico = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;

/* ============ storage ============ */
function load() {
  try { const j = JSON.parse(localStorage.getItem(KEY)) || {}; return { prefs: { ...DEF, ...(j.prefs || {}) }, runs: j.runs || [], cache: j.cache || {} }; }
  catch (e) { return { prefs: { ...DEF }, runs: [], cache: {} }; }
}
let D = load();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) {} };
let S = { tab: "home", news: "national", runView: "track", mode: "gps", mult: 1, open: null, msg: "", gpsMsg: "" };
const L = {}, E = {};

/* ============ data: news ============ */
const gn = p => `https://news.google.com/rss/${p}${p.includes("?") ? "&" : "?"}hl=en-IN&gl=IN&ceid=IN:en`;
const gs = q => gn("search?q=" + encodeURIComponent(q));
const FEEDS = {
  India: gn("headlines/section/topic/NATION"), World: gn("headlines/section/topic/WORLD"),
  Business: gn("headlines/section/topic/BUSINESS"), Sports: gn("headlines/section/topic/SPORTS"), Tech: gn("headlines/section/topic/TECHNOLOGY"),
  Assam: gs("Assam OR Guwahati when:2d"),
  Northeast: gs('"Northeast India" OR Meghalaya OR Manipur OR Nagaland OR Tripura OR Mizoram OR Arunachal when:2d'),
  Markets: gs("Sensex OR Nifty OR NSE OR BSE stocks when:1d"),
};
const NEWS_TABS = { national: ["India"], ne: ["Assam", "Northeast"], mkt: ["Markets", "Business"], world: ["World"] };
const splitTitle = (t, src) => { const k = t.lastIndexOf(" - "); if (k > 0) { if (!src) src = t.slice(k + 3); t = t.slice(0, k); } return { title: t.trim(), source: (src || "").trim() }; };

async function fetchRss(url) {
  const proxies = ["https://api.allorigins.win/raw?url=", "https://corsproxy.io/?"];
  for (const p of proxies) {
    try {
      const r = await fetch(p + encodeURIComponent(url)); if (!r.ok) continue;
      const x = new DOMParser().parseFromString(await r.text(), "text/xml");
      const items = [...x.querySelectorAll("item")].slice(0, 8).map(i => {
        const t = splitTitle(i.querySelector("title")?.textContent || "", i.querySelector("source")?.textContent || "");
        return { ...t, link: i.querySelector("link")?.textContent || "", time: i.querySelector("pubDate")?.textContent || "" };
      }).filter(i => i.title);
      if (items.length) return items;
    } catch (e) {}
  }
  try {
    const j = await (await fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(url))).json();
    if (j.items && j.items.length) return j.items.slice(0, 8).map(i => ({ ...splitTitle(i.title || "", ""), link: i.link, time: i.pubDate }));
  } catch (e) {}
  throw new Error("feed");
}

async function loadFeed(topic, force) {
  const key = "f:" + topic, c = D.cache[key];
  if (L[key] || (!force && c && Date.now() - c.at < 10 * 60000)) return;
  L[key] = true; E[key] = false; render(true);
  try { D.cache[key] = { at: Date.now(), items: await fetchRss(FEEDS[topic]) }; save(); }
  catch (e) { E[key] = true; }
  L[key] = false; render(true);
}

async function loadIdx(force) {
  const c = D.cache.idx;
  if (L.idx || (!force && c && Date.now() - c.at < 5 * 60000)) return;
  L.idx = true;
  const syms = [["Sensex", "%5EBSESN"], ["Nifty 50", "%5ENSEI"], ["Bank Nifty", "%5ENSEBANK"]];
  const out = [];
  for (const [name, s] of syms) {
    const u = `https://query1.finance.yahoo.com/v8/finance/chart/${s}?interval=1d&range=1d`;
    for (const t of [u, "https://api.allorigins.win/raw?url=" + encodeURIComponent(u)]) {
      try {
        const m = (await (await fetch(t)).json()).chart.result[0].meta;
        const p = m.regularMarketPrice, prev = m.chartPreviousClose || m.previousClose;
        out.push({ name, value: p.toLocaleString("en-IN", { maximumFractionDigits: 2 }), pct: prev ? ((p - prev) / prev) * 100 : 0 });
        break;
      } catch (e) {}
    }
  }
  if (out.length) { D.cache.idx = { at: Date.now(), data: out }; save(); }
  L.idx = false; render(true);
}

/* ============ data: weather ============ */
const WX = c => c === 0 ? "Clear sky" : c <= 3 ? "Partly cloudy" : c <= 48 ? "Fog" : c <= 57 ? "Drizzle" : c <= 67 ? "Rain" : c <= 77 ? "Snow" : c <= 82 ? "Rain showers" : c >= 95 ? "Thunderstorm" : "Cloudy";
async function loadWx(force) {
  const c = D.cache.wx;
  if (L.wx || (!force && c && Date.now() - c.at < 15 * 60000)) return;
  L.wx = true; E.wx = false; render(true);
  try {
    const u = "https://api.open-meteo.com/v1/forecast?latitude=26.1445&longitude=91.7362&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum&timezone=Asia%2FKolkata&forecast_days=5";
    D.cache.wx = { at: Date.now(), data: await (await fetch(u)).json() }; save();
    if (!D.cache.wx.data.current) throw 0;
  } catch (e) { E.wx = true; }
  L.wx = false; render(true);
}
function wxAlerts(w) {
  const a = [], d = w.daily;
  d.time.forEach((t, i) => {
    const day = i === 0 ? "Today" : new Date(t + "T00:00:00").toLocaleDateString("en-IN", { weekday: "long" });
    if (d.precipitation_sum[i] >= 65) a.push(`Heavy rain likely ${day.toLowerCase()}: about ${Math.round(d.precipitation_sum[i])} mm expected.`);
    else if (d.precipitation_sum[i] >= 25 && d.precipitation_probability_max[i] >= 60) a.push(`Rain likely ${day.toLowerCase()}: about ${Math.round(d.precipitation_sum[i])} mm expected.`);
    if (d.weather_code[i] >= 95) a.push(`Thunderstorms possible ${day.toLowerCase()}.`);
    if (d.temperature_2m_max[i] >= 37) a.push(`Very hot ${day.toLowerCase()}: up to ${Math.round(d.temperature_2m_max[i])}°C.`);
  });
  return a;
}

/* ============ run engine ============ */
const fresh = () => ({ status: "idle", elapsed: 0, dist: 0, pts: [], win: [], t3200: null, last: null, mode: "gps", mult: 1, sim: null, saved: null, base: 0, t0: 0 });
let R = fresh(), timer = null, watchId = null, wake = null;

function push(lat, lng, acc) {
  const d = R; if (d.status !== "running") return;
  if (acc && acc > 40) return;
  if (d.last) { const m = hav(d.last, { lat, lng }); if (m < 3 || m > 200) return; d.dist += m; }
  d.last = { lat, lng }; d.pts.push({ lat, lng });
  if (d.dist >= 3200 && d.t3200 == null) d.t3200 = d.elapsed;
}
function simStep() {
  const s = R.sim; s.h += 0.012 + (Math.random() - 0.5) * 0.01;
  const v = 2.7 + Math.random() * 0.5;
  s.lat += v * Math.sin(s.h) / 111320; s.lng += v * Math.cos(s.h) / (111320 * Math.cos(s.lat * Math.PI / 180));
  push(s.lat, s.lng);
}
function winPush() { const d = R; d.win.push({ t: d.elapsed, dist: d.dist }); while (d.win.length && d.win[0].t < d.elapsed - 20) d.win.shift(); }
function tick() {
  const d = R;
  if (d.mode === "demo") { for (let i = 0; i < d.mult; i++) { d.elapsed++; simStep(); winPush(); } }
  else { d.elapsed = Math.floor(d.base + (Date.now() - d.t0) / 1000); winPush(); }
  updateLive();
}
function startGps() {
  if (!navigator.geolocation) { S.gpsMsg = "This device doesn't offer GPS here. Try a demo run."; return; }
  watchId = navigator.geolocation.watchPosition(
    p => { S.gpsMsg = ""; push(p.coords.latitude, p.coords.longitude, p.coords.accuracy); updateLive(); },
    e => { S.gpsMsg = e.code === 1 ? "Location permission is off. Allow location for Zero one in Android settings, then start again." : "Waiting for a GPS fix. Move to open sky."; updateLive(); },
    { enableHighAccuracy: true, maximumAge: 1000 }
  );
}
function stopSensors() { clearInterval(timer); if (watchId != null) navigator.geolocation.clearWatch(watchId); watchId = null; releaseWake(); }
async function lockScreen() { try { wake = await navigator.wakeLock.request("screen"); } catch (e) {} }
function releaseWake() { try { wake && wake.release(); } catch (e) {} wake = null; }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && R.status === "running") lockScreen(); checkReminder(); });

function begin() {
  R = fresh(); R.status = "running"; R.mode = S.mode; R.mult = S.mult; R.t0 = Date.now(); S.gpsMsg = "";
  if (R.mode === "gps") startGps(); else { R.sim = { lat: 26.1445, lng: 91.7362, h: 0 }; push(R.sim.lat, R.sim.lng); }
  timer = setInterval(tick, 1000); lockScreen(); render();
}
function pause() { stopSensors(); R.status = "paused"; render(); }
function resume() { R.status = "running"; R.last = null; R.base = R.elapsed; R.t0 = Date.now(); if (R.mode === "gps") startGps(); timer = setInterval(tick, 1000); lockScreen(); render(); }
function finish() {
  stopSensors(); const d = R; d.status = "done";
  if (d.elapsed >= 5 && d.dist >= 10) {
    const run = { id: Date.now(), date: new Date().toISOString(), dist: d.dist, dur: d.elapsed, cal: Math.round(1.036 * D.prefs.weight * d.dist / 1000), t3200: d.t3200, demo: d.mode === "demo", pts: sample(d.pts, 120) };
    d.saved = run; D.runs.unshift(run); save();
  }
  render();
}

/* ============ views ============ */
function chips(opts, val, act) { return `<div class="chips">${opts.map(o => `<button class="chip${String(val) === String(o[0]) ? " on" : ""}" data-act="${act}" data-v="${o[0]}">${esc(o[1])}</button>`).join("")}</div>`; }
const skel = () => [95, 86, 77, 68, 59].map(w => `<div class="skel" style="width:${w}%"></div>`).join("");

function routeMap(pts, h = 200) {
  const W = 320;
  if (!pts || pts.length < 2) return `<div style="height:${h}px;background:var(--mist);border-radius:16px;display:grid;place-items:center;color:var(--mut);font-size:14px">Your route will appear here</div>`;
  const k = Math.cos(pts[0].lat * Math.PI / 180), xy = pts.map(p => ({ x: p.lng * k, y: -p.lat }));
  const xs = xy.map(p => p.x), ys = xy.map(p => p.y), x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pd = 18, s = Math.min((W - pd * 2) / (x1 - x0 || 1e-9), (h - pd * 2) / (y1 - y0 || 1e-9));
  const ox = (W - (x1 - x0) * s) / 2, oy = (h - (y1 - y0) * s) / 2;
  const P = xy.map(p => [ox + (p.x - x0) * s, oy + (p.y - y0) * s]);
  return `<svg viewBox="0 0 ${W} ${h}" width="100%" style="background:var(--mist);border-radius:16px;display:block" role="img" aria-label="Run route map"><polyline points="${P.map(p => p.map(v => v.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="#0E2A33" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${P[0][0]}" cy="${P[0][1]}" r="6" fill="#2F6B4F" stroke="#fff" stroke-width="2"/><circle cx="${P[P.length - 1][0]}" cy="${P[P.length - 1][1]}" r="6" fill="#C62828" stroke="#fff" stroke-width="2"/></svg>`;
}
function ring(v, size, inner) {
  const r = size / 2 - 9, c = 2 * Math.PI * r, p = Math.max(0, Math.min(1, v));
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="#E3ECEA" stroke-width="10"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${p >= 1 ? "#2F6B4F" : "#C62828"}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p)}"/></svg><div>${inner}</div></div>`;
}

function mergeItems(topics, max) {
  const lists = topics.map(t => (D.cache["f:" + t]?.items || []).map(i => ({ ...i, tag: t })));
  const out = [], seen = new Set();
  for (let i = 0; i < 10 && out.length < max; i++) for (const l of lists) { const it = l[i]; if (it && !seen.has(it.title) && out.length < max) { seen.add(it.title); out.push(it); } }
  return out;
}
const item = (it, showTag) => `<a class="item" href="${esc(it.link)}" target="_blank" rel="noopener"><b>${showTag ? `<span class="tag">${esc(it.tag)}</span>` : ""}${esc(it.title)}</b><div class="meta">${esc(it.source)}${it.time ? (it.source ? ", " : "") + ago(it.time) : ""}</div></a>`;
function listFor(topics, max, showTag) {
  const items = mergeItems(topics, max), busy = topics.some(t => L["f:" + t]), bad = topics.every(t => E["f:" + t]);
  if (items.length) return items.map(i => item(i, showTag)).join("");
  if (busy) return skel();
  if (bad) return `<div class="err">Couldn't load stories. Check your connection. <button class="chip" data-act="refresh">Try again</button></div>`;
  return skel();
}

function homeView() {
  const now = new Date(), w = D.cache.wx?.data, cur = w?.current;
  const wkKm = D.runs.filter(r => (now - new Date(r.date)) / 864e5 < 7).reduce((s, r) => s + r.dist, 0) / 1000;
  const topics = D.prefs.topics.filter(t => FEEDS[t]).slice(0, 4);
  return `<div class="hero"><div class="sub">Guwahati</div><div class="hero-row"><div><div style="font-family:Georgia,serif;font-size:30px;font-weight:700;line-height:1.1">${now.toLocaleDateString("en-IN", { weekday: "long" })}</div><div class="sub" style="margin-top:4px">${now.toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" })}</div></div><div class="temp">${cur ? Math.round(cur.temperature_2m) + "°C" : "--"}</div></div>
  <div style="margin-top:10px;font-size:14.5px">${cur ? `${WX(cur.weather_code)}. Rain chance today ${w.daily.precipitation_probability_max[0]}%.` : E.wx ? "Weather unavailable right now." : "Checking the sky over Guwahati..."}</div></div>
  <div class="row" style="align-items:center;margin-top:16px;justify-content:space-between"><div><div style="font-weight:700">${wkKm.toFixed(1)} km this week</div><div class="sub">Goal: ${D.prefs.goalKm} km per run</div></div><button class="btn" data-act="tab" data-v="run">${ico("run")} Start run</button></div>
  <h2>Top headlines</h2>${listFor(topics, 8, true)}`;
}
function newsView() {
  const topics = NEWS_TABS[S.news], ix = D.cache.idx?.data;
  let h = chips([["national", "India"], ["ne", "Assam and Northeast"], ["mkt", "Markets"], ["world", "World"]], S.news, "news");
  if (S.news === "mkt") {
    if (ix) h += `<div class="stats">${ix.map(x => `<div class="stat"><div class="l">${esc(x.name)}</div><div class="v" style="font-size:22px">${esc(x.value)}</div><div class="${x.pct >= 0 ? "up" : "down"}" style="font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:4px">${ico(x.pct >= 0 ? "up" : "down").replace('class="i"', 'class="i" style="width:14px;height:14px"')}${x.pct >= 0 ? "+" : ""}${x.pct.toFixed(2)}%</div></div>`).join("")}</div><div class="meta" style="margin-bottom:6px">Levels can lag the live market. Check NSE or BSE before you trade.</div>`;
    else if (L.idx) h += `<div class="sub" style="margin:10px 0">Loading index levels...</div>`;
  }
  return h + listFor(topics, 10, false);
}
function weatherView() {
  const w = D.cache.wx?.data;
  if (!w) return E.wx ? `<div class="err">Couldn't load the forecast. <button class="chip" data-act="refresh">Try again</button></div>` : skel();
  const c = w.current, d = w.daily, alerts = wxAlerts(w);
  return `<div class="hero"><div class="sub">Guwahati, Assam</div><div class="hero-row"><div class="temp">${Math.round(c.temperature_2m)}°C</div><div style="text-align:right;font-size:14.5px"><div style="font-weight:650">${WX(c.weather_code)}</div><div class="sub">Feels like ${Math.round(c.apparent_temperature)}°C</div></div></div><div class="sub" style="margin-top:10px">Humidity ${c.relative_humidity_2m}%, wind ${Math.round(c.wind_speed_10m)} km/h</div></div>
  <h2>Rain outlook</h2><div>${d.precipitation_probability_max[0]}% chance of rain today, about ${Math.round(d.precipitation_sum[0])} mm expected.</div>
  ${alerts.length ? alerts.map(a => `<div class="alert">${esc(a)}</div>`).join("") + `<div class="meta">Alerts are generated from forecast data. For official warnings see IMD.</div>` : `<div class="note">No heavy rain, storm or heat alerts in the next 5 days.</div>`}
  <h2>Next 5 days</h2>${d.time.map((t, i) => `<div class="pb"><span><b>${i === 0 ? "Today" : new Date(t + "T00:00:00").toLocaleDateString("en-IN", { weekday: "short" })}</b> <span class="sub">${WX(d.weather_code[i])}</span></span><span style="text-align:right"><b>${Math.round(d.temperature_2m_max[i])}°</b> / ${Math.round(d.temperature_2m_min[i])}° <span class="sub">rain ${d.precipitation_probability_max[i]}%</span></span></div>`).join("")}`;
}

function runTrack() {
  const d = R, P = D.prefs, goalM = P.goalKm * 1000;
  let curPace = null; const w = d.win;
  if (w.length > 1) { const a = w[0], b = w[w.length - 1]; if (b.t - a.t >= 8 && b.dist - a.dist >= 5) curPace = (b.t - a.t) / (b.dist - a.dist) * 1000; }
  const avg = d.dist > 20 ? d.elapsed / d.dist * 1000 : null, speed = curPace ? 3600 / curPace : d.elapsed ? d.dist / d.elapsed * 3.6 : 0, cal = Math.round(1.036 * P.weight * d.dist / 1000);
  const wk = weekData().total, msg = S.gpsMsg ? `<div class="note">${esc(S.gpsMsg)}</div>` : "";
  if (d.status === "idle") return `<div class="row" style="align-items:center;margin:10px 0 14px">${ring(wk / (P.goalKm || 1), 110, `<div><div style="font-weight:700;font-size:20px">${wk.toFixed(1)}</div><div class="sub" style="font-size:11px">km, 7 days</div></div>`)}<div><div style="font-weight:700;font-size:17px">Goal: ${P.goalKm} km</div><div class="sub">Run ${P.goalKm} km in one go to hit your target.</div></div></div>${routeMap([])}${chips([["gps", "Live GPS"], ["demo", "Demo run"]], S.mode, "mode")}${S.mode === "demo" ? `<div class="note">A demo run simulates a loop around Guwahati so you can try the tracker indoors.${chips([[1, "Real time"], [10, "Fast-forward x10"]], S.mult, "mult")}</div>` : ""}${msg}<button class="btn block" data-act="start">${ico("play")} Start run</button>`;
  if (d.status === "done") return `<h2>${d.saved ? "Run saved" : "Run too short to save"}</h2>${routeMap(d.pts)}<div class="stats"><div class="stat"><div class="v">${km(d.dist)}</div><div class="l">Distance (km)</div></div><div class="stat"><div class="v">${fmtDur(d.elapsed)}</div><div class="l">Time</div></div><div class="stat"><div class="v">${fmtPace(avg)}</div><div class="l">Average pace (min/km)</div></div><div class="stat"><div class="v">${cal}</div><div class="l">Calories (est.)</div></div></div>${d.dist >= goalM ? `<div class="note">You hit your ${P.goalKm} km goal.</div>` : ""}<button class="btn block" style="margin-top:12px" data-act="newrun">New run</button>`;
  return `<div style="text-align:center;margin:12px 0 4px"><div class="sub">${d.status === "paused" ? "Paused" : d.mode === "demo" ? "Demo run" : "Running"}</div><div class="big">${km(d.dist)}<span style="font-size:20px;margin-left:6px">km</span></div><div class="sub" style="margin-top:6px">${fmtDur(d.elapsed)}</div></div>
  <div style="height:8px;background:var(--mist);border-radius:4px;overflow:hidden;margin:10px 0"><div style="width:${Math.min(100, d.dist / goalM * 100)}%;height:100%;background:${d.dist >= goalM ? "var(--tea)" : "var(--red)"}"></div></div>
  <div class="sub" style="text-align:center;margin-bottom:10px">${d.dist >= goalM ? `Goal reached. ${P.goalKm} km done.` : `${((goalM - d.dist) / 1000).toFixed(2)} km to your ${P.goalKm} km goal`}</div>${routeMap(d.pts, 170)}
  <div class="stats"><div class="stat"><div class="v">${fmtPace(curPace)}</div><div class="l">Current pace (min/km)</div></div><div class="stat"><div class="v">${fmtPace(avg)}</div><div class="l">Average pace (min/km)</div></div><div class="stat"><div class="v">${speed.toFixed(1)}</div><div class="l">Speed (km/h)</div></div><div class="stat"><div class="v">${cal}</div><div class="l">Calories (est.)</div></div></div>${msg}
  <div class="row" style="margin-top:16px">${d.status === "running" ? `<button class="btn ghost" style="flex:1" data-act="pause">${ico("pause")} Pause</button>` : `<button class="btn" style="flex:1" data-act="resume">${ico("play")} Resume</button>`}<button class="btn red" style="flex:1" data-act="finish">${ico("stop")} Finish</button></div>`;
}
function weekData() {
  const t = new Date();
  const days = [...Array(7)].map((_, i) => { const d = new Date(t); d.setDate(t.getDate() - (6 - i)); return { label: d.toLocaleDateString("en-IN", { weekday: "short" }), km: D.runs.filter(r => sameDay(new Date(r.date), d)).reduce((s, r) => s + r.dist, 0) / 1000 }; });
  return { days, total: days.reduce((s, x) => s + x.km, 0) };
}
function runStats() {
  const { days, total } = weekData(), runs = D.runs, mx = Math.max(1, ...days.map(x => x.km));
  const totalKm = runs.reduce((s, r) => s + r.dist, 0) / 1000, longest = Math.max(0, ...runs.map(r => r.dist));
  const f3 = runs.filter(r => r.t3200).reduce((m, r) => (m == null || r.t3200 < m ? r.t3200 : m), null);
  const bp = runs.filter(r => r.dist >= 1000).reduce((m, r) => { const p = r.dur / r.dist * 1000; return m == null || p < m ? p : m; }, null);
  const trend = runs.filter(r => r.dist >= 500).slice(0, 10).reverse().map(r => r.dur / r.dist * 1000);
  const bars = days.map((x, i) => { const bh = x.km / mx * 82; return `<rect x="${i * 45 + 8}" y="${96 - bh}" width="28" height="${Math.max(bh, 2)}" rx="6" fill="${x.km > 0 ? "#2F6B4F" : "#D3DFDD"}"/>${x.km > 0 ? `<text x="${i * 45 + 22}" y="${90 - bh}" text-anchor="middle" font-size="11" fill="#0E2A33">${x.km.toFixed(1)}</text>` : ""}<text x="${i * 45 + 22}" y="116" text-anchor="middle" font-size="11" fill="#5E747A">${x.label}</text>`; }).join("");
  let tr = `<div class="sub">Complete two runs to see your pace trend.</div>`;
  if (trend.length >= 2) {
    const mn = Math.min(...trend), mxp = Math.max(...trend), sp = mxp - mn || 1, pts = trend.map((p, i) => [14 + i * 292 / (trend.length - 1), 14 + (p - mn) / sp * 82]);
    tr = `<svg viewBox="0 0 320 110" width="100%" role="img" aria-label="Average pace for your last runs"><polyline points="${pts.map(p => p.join(",")).join(" ")}" fill="none" stroke="#C62828" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#C62828"/>`).join("")}</svg><div class="sub">Higher on the chart means a slower pace. From ${fmtPace(trend[0])} to ${fmtPace(trend[trend.length - 1])} per km over your last ${trend.length} runs.</div>`;
  }
  return `<h2>Weekly mileage</h2><svg viewBox="0 0 320 130" width="100%" role="img" aria-label="Kilometres run in the last 7 days">${bars}</svg><div class="sub">${total.toFixed(1)} km in the last 7 days, ${totalKm.toFixed(1)} km all time</div>
  <h2>Personal bests</h2><div class="pb"><span>Longest run</span><b>${longest ? km(longest) + " km" : "--"}</b></div><div class="pb"><span>Fastest 3.2 km</span><b>${f3 ? fmtDur(f3) : "--"}</b></div><div class="pb"><span>Best average pace</span><b>${bp ? fmtPace(bp) + " /km" : "--"}</b></div><div class="pb"><span>Runs completed</span><b>${runs.length}</b></div>
  <h2>Pace progress</h2>${tr}`;
}
function runView() {
  let h = `<h1>Run</h1>` + chips([["track", "Track"], ["history", "History"], ["stats", "Stats"]], S.runView, "rv");
  if (S.runView === "track") return h + `<div id="live">${runTrack()}</div>`;
  if (S.runView === "stats") return h + runStats();
  if (!D.runs.length) return h + `<div class="note">No runs yet. Finish your first run and it will show up here.</div>`;
  return h + D.runs.map(r => `<div class="item"><button style="width:100%;text-align:left" data-act="open" data-v="${r.id}"><b>${km(r.dist)} km in ${fmtDur(r.dur)}</b><div class="meta">${new Date(r.date).toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" })}, pace ${fmtPace(r.dur / r.dist * 1000)} per km, ${r.cal} kcal${r.demo ? ", demo" : ""}</div></button>${String(S.open) === String(r.id) ? `<div style="margin-top:10px">${routeMap(r.pts, 170)}</div>` : ""}</div>`).join("") + `<button class="chip" style="margin-top:14px" data-act="clear">Clear history</button>`;
}
function feedView() {
  const P = D.prefs;
  return `<h1>My feed</h1><div class="sub">Pick topics and Zero one puts them first on your home screen.</div>
  <div style="display:flex;flex-wrap:wrap;gap:8px;margin:14px 0">${TOPICS.map(t => `<button class="chip${P.topics.includes(t) ? " on" : ""}" data-act="topic" data-v="${t}">${t}</button>`).join("")}</div>
  <h2>Morning briefing</h2>
  <div class="field"><div><b>Daily reminder</b><div class="sub">A nudge to read your briefing</div></div><button class="switch${P.notify ? " on" : ""}" role="switch" aria-checked="${P.notify}" aria-label="Daily reminder" data-act="notify"></button></div>
  <div class="field"><span>Remind me at</span><input type="time" value="${P.notifyTime}" data-pref="notifyTime"></div>
  ${P.notify ? `<button class="chip" style="margin-top:10px" data-act="test">Send a test</button>` : ""}
  ${S.msg ? `<div class="note">${esc(S.msg)}</div>` : ""}
  <div class="meta">Reminders show when Zero one is running in the background or when you open it after your set time.</div>
  <h2>Running</h2>
  <div class="field"><span>Run goal (km)</span><input type="number" min="0.5" step="0.1" value="${P.goalKm}" data-pref="goalKm"></div>
  <div class="field"><span>Body weight (kg), for calories</span><input type="number" min="30" step="1" value="${P.weight}" data-pref="weight"></div>
  <h2>Install</h2><div class="sub">Open Chrome's menu and choose Install app to add Zero one to your home screen.</div>`;
}

const TITLES = { home: "Zero one", news: "News", weather: "Weather", run: "Run", feed: "My feed" };
function render(soft) {
  if (soft && S.tab === "feed") return;
  if (soft && S.tab === "run") return;
  const t = S.tab, main = t === "home" ? homeView() : t === "news" ? newsView() : t === "weather" ? weatherView() : t === "run" ? runView() : feedView();
  const canRefresh = ["home", "news", "weather"].includes(t), y = window.scrollY;
  $("#app").innerHTML = `<div class="top"><div class="logo">01</div><div class="brand">${TITLES[t]}</div><div class="grow"></div>${canRefresh ? `<button class="icon-btn" aria-label="Refresh" data-act="refresh">${ico("refresh")}</button>` : ""}</div><div class="main">${main}</div><nav aria-label="Main">${[["home", "home", "Home"], ["news", "news", "News"], ["weather", "cloud", "Weather"], ["run", "run", "Run"], ["feed", "sliders", "My feed"]].map(([k, i, l]) => `<button class="${t === k ? "on" : ""}" data-act="tab" data-v="${k}"${t === k ? ' aria-current="page"' : ""}>${ico(i)}${l}</button>`).join("")}</nav>`;
  if (soft) window.scrollTo(0, y);
}
function updateLive() { const el = $("#live"); if (el && S.tab === "run" && S.runView === "track") el.innerHTML = runTrack(); }

/* ============ notifications ============ */
async function showNote(body) {
  try { const reg = await navigator.serviceWorker.ready; await reg.showNotification("Zero one", { body, icon: "icon-192.png", badge: "icon-192.png" }); return true; } catch (e) { return false; }
}
function checkReminder() {
  const P = D.prefs; if (!P.notify || typeof Notification === "undefined" || Notification.permission !== "granted") return;
  const n = new Date(), hm = `${pad(n.getHours())}:${pad(n.getMinutes())}`, key = n.toDateString();
  if (hm >= P.notifyTime && P.lastNotified !== key) { P.lastNotified = key; save(); showNote("Your morning briefing is ready."); }
}
setInterval(checkReminder, 30000);

/* ============ actions ============ */
function refreshCurrent(force) {
  if (S.tab === "home") { D.prefs.topics.filter(t => FEEDS[t]).slice(0, 4).forEach(t => loadFeed(t, force)); loadWx(force); }
  else if (S.tab === "news") { NEWS_TABS[S.news].forEach(t => loadFeed(t, force)); if (S.news === "mkt") loadIdx(force); }
  else if (S.tab === "weather") loadWx(force);
}
const ACT = {
  tab: v => { S.tab = v; render(); window.scrollTo(0, 0); refreshCurrent(false); },
  news: v => { S.news = v; render(); refreshCurrent(false); },
  rv: v => { S.runView = v; render(); },
  mode: v => { S.mode = v; render(); },
  mult: v => { S.mult = +v; render(); },
  refresh: () => refreshCurrent(true),
  start: begin, pause, resume, finish,
  newrun: () => { R = fresh(); render(); },
  open: v => { S.open = String(S.open) === v ? null : v; render(); },
  clear: () => { if (confirm("Delete all saved runs?")) { D.runs = []; save(); render(); } },
  topic: v => { const t = D.prefs.topics; D.prefs.topics = t.includes(v) ? t.filter(x => x !== v) : [...t, v]; save(); render(); },
  notify: async () => {
    S.msg = "";
    if (!D.prefs.notify) {
      if (typeof Notification === "undefined") { S.msg = "This browser can't show notifications."; return render(); }
      const p = await Notification.requestPermission();
      if (p !== "granted") { S.msg = "Notifications are blocked. Allow them for Zero one in Android settings, then try again."; return render(); }
    }
    D.prefs.notify = !D.prefs.notify; save(); render();
  },
  test: async () => { S.msg = (await showNote("Your morning briefing is ready.")) ? "" : "Couldn't show a test notification."; render(); },
};
document.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (b && ACT[b.dataset.act]) ACT[b.dataset.act](b.dataset.v); });
document.addEventListener("change", e => {
  const p = e.target.dataset.pref; if (!p) return;
  if (p === "notifyTime") D.prefs.notifyTime = e.target.value || "07:00";
  if (p === "goalKm") D.prefs.goalKm = Math.max(0.5, parseFloat(e.target.value) || 3.2);
  if (p === "weight") D.prefs.weight = Math.max(30, parseFloat(e.target.value) || 65);
  save();
});

/* ============ start ============ */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
render(); refreshCurrent(false); checkReminder();
</script>
</body>
</html>
